services:
  # Web Service (Laravel App)
  - type: web
    name: websolochifles-app
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false # Render provides the URL automatically
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: websolochifles-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: websolochifles-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: websolochifles-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: websolochifles-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: websolochifles-db
          property: password

  # Database Service (PostgreSQL)
  - type: psql
    name: websolochifles-db
    plan: free
    region: oregon
    databaseName: websolochifles
    user: websolochifles

databases:
  - name: websolochifles-db
    plan: free
    region: oregon
